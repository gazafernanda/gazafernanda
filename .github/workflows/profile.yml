name: Update profile card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_card.py"
      - "assets/fonts/**"
      - ".github/workflows/profile.yml"

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Render the profile card
        run: python3 scripts/build_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the card if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card-dark.svg assets/card-light.svg
          if git diff --cached --quiet; then
            echo "Card unchanged"
          else
            git commit -m "chore: refresh profile card"
            git push
          fi
